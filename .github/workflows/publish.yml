name: Publish v1.0 release (one-time bootstrap)

# The GitHub API tools used to create this repo can only upload text files,
# so the signed APK (built and signed locally, versionCode 1) and the binary parts of the
# Android project (launcher icons, gradle-wrapper.jar) were uploaded as base64.
# This workflow decodes them, verifies SHA-256, creates Release v1.0 with the APK,
# commits the binary Android files, removes the payload and publishes gh-pages.
# It does NOT build or sign anything.

on:
  push:
    branches: [main]
    paths: ['.github/bootstrap/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify payload
        run: |
          set -euo pipefail
          test -f .github/bootstrap/zvezdnaya-gryadka.apk.b64 || { echo "payload already processed"; exit 0; }
          mkdir -p /tmp/p
          base64 -d .github/bootstrap/zvezdnaya-gryadka.apk.b64 > /tmp/p/zvezdnaya-gryadka.apk
          echo "$(cat .github/bootstrap/zvezdnaya-gryadka.apk.sha256)  /tmp/p/zvezdnaya-gryadka.apk" | sha256sum -c -
          echo "61b93070203d4d3c0263486d35cda3a2d3afe2be07ed94d9ac3923426cb45089  /tmp/p/zvezdnaya-gryadka.apk" | sha256sum -c -
          base64 -d .github/bootstrap/android-binaries.tgz.b64 > /tmp/p/bin.tgz
          echo "$(cat .github/bootstrap/android-binaries.tgz.sha256)  /tmp/p/bin.tgz" | sha256sum -c -
          echo "6a4e14df86a51e1a8b96db1ad83df65b47398347dbceb46417a0aad24a8f2d65  /tmp/p/bin.tgz" | sha256sum -c -
          tar tzf /tmp/p/bin.tgz | grep -vE '^(app/src/main/res/mipmap-[a-z]+/ic_launcher[a-z_]*\.png|gradle/wrapper/gradle-wrapper\.jar)$' && { echo "unexpected file in archive"; exit 1; } || true
          ls -l /tmp/p

      - name: Create release v1.0 with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f /tmp/p/zvezdnaya-gryadka.apk || exit 0
          gh release view v1.0 >/dev/null 2>&1 && { echo "release exists"; exit 0; }
          cat > /tmp/notes.md <<'NOTES'
          «Звёздная Грядка» 1.0 — первая версия активной фермерской приключенческой игры.

          - Мир Радужных Холмов: свой хутор и 5 зон (Медовая Опушка, Хрустальные Пещеры, Туманное Болото, Огненная Гора, Облачные Острова), у каждой свои ресурсы, монстры и босс.
          - Добыча на ловкость: рубка с кольцом и комбо, руда с бегунком и критами, рыбалка с подсечкой и удержанием рыбки в рамке, полив с точным отпусканием.
          - Бои в реальном времени: комбо из 3 ударов, кувырок с неуязвимостью, 10 видов монстров, элитные монстры и 5 боссов с красными зонами-предупреждениями.
          - Ферма: посадка, полив на каждой стадии, рост в реальном времени, сбор урожая; кузница, мастерская, склад, огород до 5 уровня; лавка кошки Ромашки.
          - Снаряжение до 10 уровня (меч, броня, топор, кирка, удочка) по рецептам из ресурсов разных зон.
          - Уровни, очки навыков, 24 главных и ежедневные задания, случайные события (радужная жила, сундук, элитный монстр, золотая рыбка).
          - Работает без интернета, прогресс сохраняется на устройстве автоматически.

          Android 7.0+, пакет com.luntikvisuals.zvezdnayagryadka, versionCode 1, портретная ориентация.
          SHA-256: 61b93070203d4d3c0263486d35cda3a2d3afe2be07ed94d9ac3923426cb45089
          NOTES
          sed -i 's/^          //' /tmp/notes.md
          gh release create v1.0 /tmp/p/zvezdnaya-gryadka.apk --target main --latest --title "Звёздная Грядка v1.0" --notes-file /tmp/notes.md

      - name: Add Android binaries, remove payload, publish gh-pages
        run: |
          set -euo pipefail
          test -f /tmp/p/zvezdnaya-gryadka.apk || exit 0
          tar xzf /tmp/p/bin.tgz -C android
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          git rm -q -r .github/bootstrap
          git commit -m "Add Android launcher icons and gradle wrapper jar; remove v1.0 bootstrap payload (APK published in Release v1.0)"
          git push origin HEAD:main
          git push origin HEAD:gh-pages

      - name: Enable / rebuild GitHub Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages" -f "source[branch]=gh-pages" -f "source[path]=/" || echo "Pages site create not permitted or already exists"
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages rebuild request not permitted; the push to gh-pages should trigger it."
