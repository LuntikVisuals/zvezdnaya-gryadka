<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2b1a4f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Звёздная Грядка</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#1d1238;touch-action:none;overscroll-behavior:none;font-family:"Trebuchet MS","Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;color:#fff}
#cv{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#probe{position:fixed;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px);pointer-events:none;visibility:hidden}
.ui{position:fixed;z-index:5}
#menuBtns{right:calc(8px + var(--sr));top:calc(8px + var(--st));display:flex;flex-direction:column;gap:7px}
.mb{width:48px;height:48px;border-radius:14px;background:linear-gradient(#ffffff38,#ffffff10),#3a2a6acc;border:2px solid #ffffff55;box-shadow:0 3px 0 #0005;display:flex;align-items:center;justify-content:center;position:relative}
.mb img{width:34px;height:34px;pointer-events:none}
.mb:active{transform:translateY(2px);box-shadow:0 1px 0 #0005}
.mb .dot{position:absolute;right:-3px;top:-3px;width:14px;height:14px;border-radius:50%;background:#ff3b5c;border:2px solid #fff;display:none}
.mb.alert .dot{display:block;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.3)}}
#joyZone{left:0;bottom:0;width:52%;height:46%;z-index:4}
#joyBase{position:fixed;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;background:radial-gradient(#ffffff22,#ffffff10 60%,#ffffff30);border:3px solid #ffffff55;pointer-events:none;z-index:4;opacity:.55}
#joyKnob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#d8c8ff 40%,#8a6ad8);box-shadow:0 3px 8px #0006}
.cb{position:fixed;z-index:6;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;border:3px solid #ffffffaa;box-shadow:0 5px 0 #0006,inset 0 -6px 12px #0003,inset 0 6px 10px #fff5;color:#fff;font-weight:bold;text-shadow:0 2px 2px #0008;touch-action:none}
.cb img{pointer-events:none}
.cb.on{transform:translateY(3px) scale(.95);box-shadow:0 2px 0 #0006,inset 0 -6px 12px #0003}
#bAtk{width:92px;height:92px;right:calc(20px + var(--sr));bottom:calc(34px + var(--sb));background:radial-gradient(circle at 40% 30%,#ff8a7a,#e8344a 60%,#a51530)}
#bAtk img{width:54px;height:54px}
#bAct{width:84px;height:84px;right:calc(118px + var(--sr));bottom:calc(84px + var(--sb));background:radial-gradient(circle at 40% 30%,#9ff7a0,#2fbf5a 60%,#167a36);font-size:11px}
#bAct img{width:44px;height:44px}
#bAct.hide{display:none}
#bAct span{margin-top:-2px;white-space:nowrap}
#bRoll{width:62px;height:62px;right:calc(30px + var(--sr));bottom:calc(140px + var(--sb));background:radial-gradient(circle at 40% 30%,#8fd8ff,#2f8fe0 60%,#16529a)}
#bRoll img{width:38px;height:38px}
#bPot{width:52px;height:52px;right:calc(110px + var(--sr));bottom:calc(18px + var(--sb));background:radial-gradient(circle at 40% 30%,#ffb3ec,#d846b4 60%,#8a1f74);font-size:12px}
#bPot img{width:30px;height:30px}
#bPot b{position:absolute;right:-4px;bottom:-4px;background:#fff;color:#8a1f74;border-radius:10px;padding:0 5px;text-shadow:none;font-size:12px}
#bPot.hide{display:none}
#panelWrap{position:fixed;inset:0;z-index:20;background:#0008;display:none;align-items:center;justify-content:center;padding:calc(10px + var(--st)) 10px calc(10px + var(--sb))}
#panelWrap.show{display:flex}
#panel{width:min(96vw,460px);max-height:100%;display:flex;flex-direction:column;background:linear-gradient(#fff8e8,#ffe9c2);color:#4a2d12;border-radius:20px;border:4px solid #7a4a1c;box-shadow:0 8px 0 #3d2208,0 0 40px #0008;overflow:hidden;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}}
#pHead{display:flex;align-items:center;padding:10px 12px;background:linear-gradient(#ffb547,#f08a1c);color:#fff;text-shadow:0 2px 0 #9a4a00;font-size:21px;font-weight:bold;border-bottom:3px solid #7a4a1c}
#pHead img{width:30px;height:30px;margin-right:8px}
#pTitle{flex:1}
#pClose{width:38px;height:38px;border-radius:12px;background:#e8344a;border:2px solid #fff;color:#fff;font-size:22px;font-weight:bold;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #8a1020}
#pTabs{display:flex;gap:4px;padding:6px 8px 0;background:#f6d9a4}
.tab{flex:1;text-align:center;padding:8px 2px;border-radius:12px 12px 0 0;background:#e6bf7f;font-weight:bold;font-size:14px;color:#7a4a1c}
.tab.sel{background:#fff8e8;color:#4a2d12}
#pBody{overflow-y:auto;padding:10px;touch-action:pan-y;-webkit-overflow-scrolling:touch;flex:1}
.row{display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:8px;margin-bottom:8px;border:2px solid #e8c48a}
.row.dim{opacity:.55}
.row .ic{width:44px;height:44px;flex:none;border-radius:10px;background:#fbeacc;display:flex;align-items:center;justify-content:center}
.row .ic img{width:38px;height:38px}
.row .tx{flex:1;min-width:0}
.row .nm{font-weight:bold;font-size:15px}
.row .ds{font-size:12px;color:#8a6a3a;margin-top:2px}
.btn{padding:9px 12px;border-radius:12px;border:none;background:linear-gradient(#5fd36a,#2a9a3a);color:#fff;font-weight:bold;font-size:14px;box-shadow:0 3px 0 #17602a;text-shadow:0 1px 1px #0006;font-family:inherit;white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #17602a}
.btn.no{background:linear-gradient(#c9b9a0,#a08c70);box-shadow:0 3px 0 #6a5a40}
.btn.gold{background:linear-gradient(#ffd34a,#f0a010);box-shadow:0 3px 0 #9a6a00}
.btn.blue{background:linear-gradient(#6ac8ff,#2a7ae0);box-shadow:0 3px 0 #1a4a9a}
.mats{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.mat{display:flex;align-items:center;gap:2px;background:#fbeacc;border-radius:8px;padding:1px 6px 1px 2px;font-size:12px;font-weight:bold}
.mat img{width:20px;height:20px}
.mat.bad{background:#ffd0d0;color:#c0202a}
.mat.ok{background:#d4f5c8;color:#2a7a20}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{aspect-ratio:1;background:#fff;border:2px solid #e8c48a;border-radius:12px;position:relative;display:flex;align-items:center;justify-content:center}
.slot img{width:78%;height:78%}
.slot b{position:absolute;right:3px;bottom:1px;font-size:13px;color:#4a2d12;text-shadow:0 0 3px #fff,0 0 3px #fff}
.slot.sel{border-color:#f08a1c;background:#fff3d6;box-shadow:0 0 0 2px #f08a1c}
.slot.empty{background:#f6e2bb;border-style:dashed}
.info{background:#fff;border-radius:14px;padding:10px;margin:8px 0;border:2px solid #e8c48a;font-size:14px}
.bar{height:12px;background:#e8d4b0;border-radius:6px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#5fd36a,#9af06a);border-radius:6px}
.h2{font-weight:bold;font-size:16px;margin:6px 2px 8px;color:#7a4a1c}
.lvl{display:inline-block;background:#7a4a1c;color:#fff;border-radius:8px;padding:0 6px;font-size:12px;margin-left:4px}
#toast{position:fixed;left:50%;top:calc(var(--st) + 175px);transform:translateX(-50%);z-index:15;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px}
.tst{background:#2b1a4fdd;border:2px solid #ffffff66;color:#fff;padding:7px 14px;border-radius:14px;font-weight:bold;font-size:14px;text-align:center;animation:tin .25s ease-out;max-width:calc(100vw - 140px)}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
#title{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 30%,#7a5ae0,#3a1f7a 55%,#1d1238)}
#title canvas{position:absolute;inset:0;width:100%;height:100%}
#title .logo{position:relative;font-size:46px;font-weight:900;text-align:center;line-height:1;color:#fff36a;text-shadow:0 4px 0 #e0700a,0 8px 0 #7a2a8a,0 12px 20px #0008;letter-spacing:1px;transform:rotate(-3deg)}
#title .logo small{display:block;font-size:20px;color:#bff7ff;text-shadow:0 3px 0 #2a5ab0;margin-top:12px;letter-spacing:0}
#title .tb{position:relative;font-size:22px;padding:14px 34px;border-radius:20px;min-width:230px}
#title .ver{position:absolute;bottom:calc(10px + var(--sb));font-size:12px;opacity:.6}
#dead{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:#3a0a20cc;font-size:26px;font-weight:bold;text-align:center;text-shadow:0 3px 0 #0008}
#dead.show{display:flex}
#rotate{display:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="probe"></div>
<div id="menuBtns" class="ui">
  <div class="mb" id="mBag"><img data-ic="bag"><i class="dot"></i></div>
  <div class="mb" id="mQuest"><img data-ic="scroll"><i class="dot"></i></div>
  <div class="mb" id="mSkill"><img data-ic="star"><i class="dot"></i></div>
  <div class="mb" id="mMap"><img data-ic="map"><i class="dot"></i></div>
  <div class="mb" id="mSet"><img data-ic="gear"><i class="dot"></i></div>
</div>
<div id="joyZone" class="ui"></div>
<div id="joyBase"><div id="joyKnob"></div></div>
<div class="cb" id="bAtk"><img data-ic="sword"></div>
<div class="cb hide" id="bAct"><img data-ic="hand"><span>Взять</span></div>
<div class="cb" id="bRoll"><img data-ic="roll"></div>
<div class="cb hide" id="bPot"><img data-ic="potion"><b>0</b></div>
<div id="toast"></div>
<div id="dead"><div>Ой! Ты выбился из сил...</div><div style="font-size:16px;font-weight:normal">Добрые светлячки отнесли тебя домой на ферму</div><button class="btn gold" id="deadOk" style="font-size:20px;padding:12px 30px">Проснуться</button></div>
<div id="panelWrap"><div id="panel"><div id="pHead"><img id="pIcon"><div id="pTitle"></div><div id="pClose">&times;</div></div><div id="pTabs"></div><div id="pBody"></div></div></div>
<div id="title"><canvas id="tcv"></canvas>
  <div class="logo">Звёздная<br>Грядка<small>приключения юного фермера</small></div>
  <div style="height:20px"></div>
  <button class="btn gold tb" id="tPlay">Играть</button>
  <button class="btn blue tb" id="tNew" style="display:none">Новая игра</button>
  <div class="ver">версия 1.0 • работает без интернета</div>
</div>
<script>
'use strict';
// ===== utils =====
const TAU=Math.PI*2;
const rnd=(a,b)=>a+Math.random()*(b-a);
const rndi=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(a,b,c,d)=>Math.hypot(c-a,d-b);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function mulberry(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function hash2(x,y){let h=(x*374761393+y*668265263)|0;h=(h^(h>>>13))*1274126177|0;return ((h^(h>>>16))>>>0)/4294967296;}
function angDiff(a,b){let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;}
function fmt(n){n=Math.floor(n);return n>=10000?(n/1000).toFixed(n>=100000?0:1)+'к':''+n;}

// ===== zones =====
const T=40; // tile size (world units)
const ZONES=[
 {n:'Уютный Хутор',g:['#7fd06a','#74c560'],path:'#e3c48a',water:['#4fb8f0','#7fd4ff'],wall:['#3f9a4a','#2c7a38'],void:'#2c7a38',fx:'leaf'},
 {n:'Медовая Опушка',g:['#8ede6a','#82d25e'],path:'#e8cf8f',water:['#47b4ee','#86dcff'],wall:['#5aa04a','#3e7d34'],void:'#3e7d34',tree:['#3fae4a','#5fd05a','#2a8a3a'],trunk:'#8a5a2a',rock:['#b8b8c8','#8c8ca0'],ore:'#ff9a3a',bush:'#e8344a',fx:'pollen',lvl:1},
 {n:'Хрустальные Пещеры',g:['#5a4a8a','#544280'],path:'#7a6aa8',water:['#2a3aa0','#5a7ae8'],wall:['#2e2252','#3e2e6a'],void:'#1a1030',tree:['#4ae0e0','#8af7ff','#2aa0c0'],trunk:'#d8d0f0',rock:['#c8b8f0','#9a88d0'],ore:'#d8e4f0',bush:'#7affc0',fx:'sparkle',lvl:4},
 {n:'Туманное Болото',g:['#6a9a5a','#628f52'],path:'#9a8a5a',water:['#3a7a6a','#5aa08a'],wall:['#3a5a3a','#2a4a2a'],void:'#2a4a2a',tree:['#5a8a3a','#7aa04a','#3a6a2a'],trunk:'#5a4a2a',rock:['#8a9a7a','#6a7a5a'],ore:'#3ae08a',bush:'#f0e0ff',fx:'mist',lvl:8},
 {n:'Огненная Гора',g:['#5a4040','#523838'],path:'#7a5a4a',water:['#ff6a1a','#ffc24a'],wall:['#2a1a1a','#3a2626'],void:'#ff5a10',tree:['#5a5a5a','#8a7a70','#3a3a3a'],trunk:'#2a2020',rock:['#3a3048','#24203a'],ore:'#ff4a1a',bush:'#ff8a2a',fx:'ember',lvl:12},
 {n:'Облачные Острова',g:['#f4f0ff','#eae6fa'],path:'#ffe9a8',water:['#8ad8ff','#c8f0ff'],wall:['#d8d0f0','#bdb4e0'],void:'#7ac0ff',tree:['#ffb8e8','#ffd8f4','#e890d0'],trunk:'#c8a0d8',rock:['#c8d8ff','#98b0e8'],ore:'#ffd84a',bush:'#ffffff',fx:'cloud',lvl:16},
];
// ===== items =====
// ic: icon shape, c: colors, p: sell price
const IT={};
function defItem(id,n,ic,c,p,extra){IT[id]=Object.assign({id,n,ic,c,p},extra||{});}
const ZI=[null,
 {w:['Дубовое бревно','#a0682e','#e8c08a'],r:['Камень','#a8a8b8'],o:['Медная руда','#ff9a3a'],d:['Желейка','#6ae05a'],f:['Луговой карась','#ffc84a'],h:['Медовая ягода','#e8344a'],b:['Корень Короля Пней','#8a5a2a']},
 {w:['Светогриб','#8af7ff','#e0fbff'],r:['Кварц','#d8c8ff'],o:['Железная руда','#c8d8e8'],d:['Крыло нетопыря','#6a4a9a'],f:['Слепой сомик','#e8d8ff'],h:['Светящийся мох','#7affc0'],b:['Сердце голема','#4ae0e0']},
 {w:['Ивовое бревно','#6a7a3a','#c8d890'],r:['Тинный камень','#7a8a6a'],o:['Нефрит','#3ae08a'],d:['Лягушачья слизь','#9ae04a'],f:['Болотный угорь','#4a8a5a'],h:['Тинная лилия','#f0d0ff'],b:['Корона Тины','#7ae0a0']},
 {w:['Пепельное бревно','#4a3a3a','#9a8a80'],r:['Обсидиан','#3a3048'],o:['Огненная руда','#ff4a1a'],d:['Уголёк саламандры','#ff8a2a'],f:['Лавовый окунь','#ff5a2a'],h:['Огнецвет','#ffb02a'],b:['Драконья чешуя','#e0302a']},
 {w:['Облачное дерево','#f0c8f0','#fff0ff'],r:['Лунный камень','#c8d8ff'],o:['Небесное золото','#ffd84a'],d:['Грозовое перо','#6ac8ff'],f:['Небесный скат','#8ab8ff'],h:['Облачный хлопок','#ffffff'],b:['Перо феникса','#ff9a3a']},
];
const PR={w:3,r:2,o:6,d:5,f:9,h:4,b:150};
const ICS={w:'log',r:'rock',o:'ore',d:'drop',f:'fish',h:'herb',b:'boss'};
for(let z=1;z<=5;z++){for(const k in ZI[z]){const d=ZI[z][k];defItem(k+z,d[0],ICS[k],[d[1],d[2]||'#fff'],Math.round(PR[k]*Math.pow(2.3,z-1)),{z,k,food:k==='h'?8+z*6:k==='f'?14+z*10:0});}}
defItem('gem','Радужный самоцвет','gem',['#ff6ad8','#6ae0ff'],400);
defItem('gfish','Золотая рыбка','fish',['#ffd700','#fff8a0'],250,{food:60});
defItem('potion','Зелье здоровья','potion',['#ff4ab4','#ffb3ec'],15);
// crops: stage time in seconds
const CROPS=[
 {id:'carrot',n:'Морковь',c:'#ff8a1a',l:'#4ac04a',t:15,price:9,seed:4,unlock:1,yield:[2,3]},
 {id:'pumpkin',n:'Солнечная тыква',c:'#ffb81a',l:'#3a9a3a',t:35,price:26,seed:11,unlock:2,yield:[1,2]},
 {id:'straw',n:'Хрустальная клубника',c:'#ff4a8a',l:'#4ad0a0',t:60,price:48,seed:20,unlock:3,yield:[3,4]},
 {id:'pepper',n:'Огнеперчик',c:'#ff2a1a',l:'#2a8a2a',t:95,price:110,seed:45,unlock:4,yield:[2,3]},
 {id:'cabbage',n:'Облачная капуста',c:'#c8e0ff',l:'#8ad0ff',t:150,price:240,seed:95,unlock:5,yield:[2,3]},
];
const CROP={};CROPS.forEach(c=>{CROP[c.id]=c;defItem(c.id,c.n,'veg',[c.c,c.l],c.price,{food:10+c.price/3,crop:c.id});defItem('s_'+c.id,'Семена: '+c.n,'seed',[c.c,c.l],Math.ceil(c.seed/2),{seed:c.id});});

// ===== equipment =====
const EQ={
 axe:{n:'Топор',ic:'axe',where:'work'},
 pick:{n:'Кирка',ic:'pick',where:'work'},
 rod:{n:'Удочка',ic:'rod',where:'work'},
 sword:{n:'Меч',ic:'sword',where:'forge'},
 armor:{n:'Броня',ic:'armor',where:'forge'},
};
const EQ_ORDER=['sword','armor','axe','pick','rod'];
const MATCOL=['#9a9aa8','#c87a3a','#a8c8e8','#3ae08a','#ff5a1a','#ffd84a','#ff6ad8'];
function eqColor(l){return MATCOL[Math.min(6,Math.ceil(l/2))]}
function recipe(type,L){
 const z=Math.ceil(L/2); // zone tier 1..5
 const m={};const add=(id,n)=>{m[id]=(m[id]||0)+n;};
 if(type==='axe'){add('o'+z,3+L);add('w'+z,5+L);}
 if(type==='pick'){add('o'+z,4+L);add('r'+z,5+L);}
 if(type==='rod'){add('w'+z,4+L);add('f'+z,2+(L>>1));add('h'+z,3);}
 if(type==='sword'){add('o'+z,5+L);add('d'+z,3+L);}
 if(type==='armor'){add('d'+z,4+L);add('r'+z,4+L);add('h'+z,3);}
 if(L%2===1&&L>=3)add('b'+(z-1),1);
 if(L%2===0&&L>=4)add('o'+(z-1),4);
 if(L===10)add('gem',1);
 return {coins:15*L*L,mats:m,bld:z};
}
const swordDmg=L=>Math.round(10*Math.pow(1.36,L-1));
const armorRed=L=>Math.min(0.62,(L-1)*0.068);
// ===== buildings =====
const BLD={
 forge:{n:'Кузница',d:'Куёт мечи и броню. Уровень кузницы = макс. уровень снаряжения ×2',ic:'anvil'},
 work:{n:'Мастерская',d:'Делает топоры, кирки и удочки',ic:'saw'},
 store:{n:'Склад',d:'Больше ячеек в сумке и больше предметов в стопке',ic:'box'},
 field:{n:'Огород',d:'Больше грядок и вместительная лейка',ic:'seed'},
};
function bldCost(id,L){ // cost to reach level L (2..5)
 const z=L-1;const m={};
 if(id==='forge'){m['r'+z]=12+z*3;m['o'+z]=8+z*2;if(z>1)m['b'+(z-1)]=1;}
 if(id==='work'){m['w'+z]=14+z*3;m['o'+z]=6+z*2;if(z>1)m['b'+(z-1)]=1;}

 if(f<0){r*=1+f;g*=1+f;b*=1+f;}else{r+=(255-r)*f;g+=(255-g)*f;b+=(255-b)*f;}return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function star(c,x,y,r1,r2,n){c.beginPath();for(let i=0;i<n*2;i++){const a=i*Math.PI/n-Math.PI/2,r=i%2?r2:r1;c.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}c.closePath();}
function outl(c,w){c.lineWidth=w||3;c.strokeStyle='#3a2210';c.stroke();}

function updatePlayer(dt){

 p.iT-=dt;p.rollT-=dt;p.toolAnim=Math.max(0,p.toolAnim-dt*3);p.comboWin-=dt;
 const mh=maxHP(),ms=maxST();

 let jx=input.jx,jy=input.jy;

 if(kx||ky){const l=Math.hypot(kx,ky);jx=kx/l;jy=ky/l;}

  if(jm>.2){p.rdx=jx/jm;p.rdy=jy/jm;}else{p.rdx=p.fx;p.rdy=p.fy;}sfx('roll');stat('roll');burst(p.x,p.y,'#fff8',6,80,3,0);}
  else if(p.st<22)floater(p.x,p.y-50,'Нет сил!','#ffe84a',14,.7);}
 p.vx=0;p.vy=0;
 if(p.rollT>0){const sp=380;moveEnt(p,p.rdx*sp*dt,p.rdy*sp*dt,p.r,false,true);p.vx=p.rdx*sp;p.vy=p.rdy*sp;p.moving=true;if(Math.random()<.5)spark(p.x,p.y,'#ffffff90',30,.3,3,0);}
 else if(!mg||mg.kind==='fish'&&mg.phase==='reel'&&false){
  if(jm>.12&&!deadNow){const sp=155*(p.atkT>0?.35:1)*Math.min(1,jm*1.2);p.fx=jx/jm;p.fy=jy/jm;

  else p.moving=false;

  case 'tree':case 'rock':case 'bush':if(o.dead>0)continue;d=dist(P.x,P.y,o.x,o.y)-o.r-30;break;
  case 'fspot':d=dist(P.x,P.y,o.x,o.y)-78;break;

bindBtn('bAct',()=>{input.act=true;input.actDown=true;},()=>{input.actDown=false;input.actUp=true;});
bindBtn('bRoll',()=>{input.roll=true;});
bindBtn('bPot',()=>{if(!has('potion',1))return;if(P.hp>=maxHP()){toast('Здоровье и так полное');return;}take('potion',1);P.hp=Math.min(maxHP(),P.hp+maxHP()*.5);sfx('quest');burst(P.x,P.y-20,['#ff4ab4','#fff'],16,140);floater(P.x,P.y-56,'+'+Math.round(maxHP()*.5),'#6aff8a',20);updateAlerts();});
const mbOpen={mBag:'bag',mQuest:'quest',mSkill:'skill',mMap:'map',mSet:'set'};
for(const id in mbOpen)$(id).addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();initAudio();if(deadNow)return;if(mg)cancelMg();openPanel(mbOpen[id]);});
$('pClose').addEventListener('click',closePanel);
$('panelWrap').addEventListener('pointerdown',e=>{if(e.target===$('panelWrap'))closePanel();});
$('pBody').addEventListener('click',panelClick);$('pTabs').addEventListener('click',panelClick);
$('deadOk').addEventListener('click',revive);
cv.addEventListener('pointerdown',e=>{initAudio();if(questRect&&e.clientX>=questRect.x&&e.clientX<=questRect.x+questRect.w&&e.clientY>=questRect.y&&e.clientY<=questRect.y+questRect.h){if(mainQDone())claimMain();else openPanel('quest');}});
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(e.repeat){return;}input.keys[k]=true;
 if(!started)return;
 if(k==='escape'){window.__gameBack();return;}
 if(panelOpen)return;
 if(k===' '||k==='j'){input.atk=true;e.preventDefault();}
 if(k==='e'||k==='enter'){input.act=true;input.actDown=true;}
 if(k==='shift'||k==='k'){input.roll=true;}
 if(k==='q'&&has('potion',1))$('bPot').dispatchEvent(new PointerEvent('pointerdown'));
 if(k==='i'||k==='b')openPanel('bag');});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();input.keys[k]=false;if(k==='e'||k==='enter'){input.actDown=false;input.actUp=true;}});
window.addEventListener('blur',()=>{input.keys={};input.actDown=input.atkDown=false;resetJoy();});
document.addEventListener('touchmove',e=>{if(!e.target.closest||!e.target.closest('#pBody'))e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());

// ===== resize =====
function resize(){
 VW=window.innerWidth;VH=window.innerHeight;DPR=Math.min(2,window.devicePixelRatio||1);
 cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);
 const pr=getComputedStyle($('probe'));SA={t:parseFloat(pr.top)||0,b:VH-(parseFloat(pr.bottom)!==undefined?VH-(parseFloat(pr.bottom)||0):VH),l:parseFloat(pr.left)||0,r:parseFloat(pr.right)||0};
 SA.b=parseFloat(pr.bottom)||0;
 document.documentElement.style.setProperty('--st',SA.t+'px');document.documentElement.style.setProperty('--sb',SA.b+'px');document.documentElement.style.setProperty('--sr',SA.r+'px');
 cam.z=clamp(Math.min(VW/370,VH/560),.75,1.7);
 const ns=Math.round(cam.z*DPR*4)/4;if(ns!==chunkScale){chunkScale=ns;resetChunks();}
 if(tcv){tcv.width=VW*DPR;tcv.height=VH*DPR;}
 placeJoyDefault();
}
window.addEventListener('resize',resize);
// ===== title =====
const tcv=$('tcv'),tctx=tcv.getContext('2d');let titleStars=[];let titleT=0;
function drawTitle(dt){titleT+=dt;const c=tctx;c.setTransform(DPR,0,0,DPR,0,0);c.clearRect(0,0,VW,VH);
 if(titleStars.length<60)titleStars.push({x:rnd(0,VW),y:rnd(0,VH),s:rnd(1,3.5),p:rnd(0,TAU)});
 for(const s of titleStars){c.globalAlpha=.4+.4*Math.sin(titleT*2+s.p);c.fillStyle='#fff8c0';star(c,s.x,s.y,s.s*2,s.s*.8,4);c.fill();}
 c.globalAlpha=1;
 // hills
 const h=VH*.78;c.fillStyle='#5ac06a';c.beginPath();c.moveTo(0,VH);c.lineTo(0,h);for(let x=0;x<=VW;x+=10)c.lineTo(x,h-Math.sin(x/90+1)*24-18);c.lineTo(VW,VH);c.fill();
 c.fillStyle='#7fd06a';c.beginPath();c.moveTo(0,VH);for(let x=0;x<=VW;x+=10)c.lineTo(x,h+30-Math.sin(x/70+3)*18);c.lineTo(VW,VH);c.fill();
 // garden bed with sprouts
 const by=h+60;c.fillStyle='#8a5a2a';rr(c,VW/2-120,by,240,40,14);c.fill();
 for(let i=0;i<5;i++){const x=VW/2-90+i*45,bb=Math.sin(titleT*2+i)*3;c.strokeStyle='#3a9a3a';c.lineWidth=4;c.beginPath();c.moveTo(x,by+16);c.lineTo(x,by-10+bb);c.stroke();c.fillStyle=['#ff8a1a','#ffb81a','#ff4a8a','#ff2a1a','#c8e0ff'][i];c.beginPath();c.arc(x,by-16+bb,10,0,TAU);c.fill();c.fillStyle='#ffe84a';star(c,x,by-16+bb,5,2,5);c.fill();}
}
// ===== start =====
function startGame(fresh){
 if(fresh){localStorage.removeItem(SAVE_KEY);S=null;}
 S=load()||newState();ensureDaily();
 P=newPlayer();P.hp=Math.min(maxHP(),S.hp||maxHP());if(P.hp<=0)P.hp=maxHP();
 let z=S.zone||0;if(!unlocked(z))z=0;
 if(S.q===0&&!S.qBase.m)S.qBase.m=S.stats.chop||0;
 enterZone(z,S.px!==null?{x:S.px,y:S.py}:null);
 $('title').classList.add('gone');$('title').style.display='none';started=true;lastT=performance.now();
 if(!S.tut){S.tut=1;setTimeout(()=>toast('Двигайся джойстиком в левой части экрана'),600);setTimeout(()=>toast('Подойди к дереву и жми зелёную кнопку'),3200);setTimeout(()=>toast('Заглядывай в задания — там подсказки!'),6000);}
 updateAlerts();save();
}
(function init(){
 document.querySelectorAll('img[data-ic]').forEach(im=>im.src=iconURL(im.dataset.ic));
 resize();resetJoy();
 const has=!!load();
 $('tPlay').textContent=has?'Продолжить':'Играть';
 if(has)$('tNew').style.display='';
 let armNew=false;
 $('tPlay').addEventListener('click',()=>{initAudio();tryFull();startGame(false);});
 $('tNew').addEventListener('click',()=>{if(!armNew){armNew=true;$('tNew').textContent='Точно? Нажми ещё раз';return;}initAudio();tryFull();startGame(true);});
 requestAnimationFrame(frame);
})();
function tryFull(){try{const d=document.documentElement;if(d.requestFullscreen&&!document.fullscreenElement&&matchMedia('(pointer:coarse)').matches)d.requestFullscreen().catch(()=>{});if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('portrait').catch(()=>{});}catch(e){}}
</script>
